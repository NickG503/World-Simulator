# Flashlight object definition
# Simplified for tree-based simulation with flat if-elif-else structure

type: flashlight
parts:
  switch:
    attributes:
      position:
        space: binary_state
        default: 'off'
        mutable: true
  bulb:
    attributes:
      state:
        space: binary_state
        default: 'off'
        mutable: true
      brightness:
        space: brightness_level
        default: none
  battery:
    attributes:
      level:
        space: battery_level
        default: medium
        mutable: true
      type:
        space: battery_types
        mutable: true
        default: AA

constraints:
  # Dependency constraint: bulb can only be on if battery is not empty
  - type: dependency
    condition:
      type: attribute_check
      target: bulb.state
      operator: equals
      value: on
    requires:
      type: attribute_check
      target: battery.level
      operator: not_equals
      value: empty

  # Branching constraint: defines atomic states based on battery level
  # IF battery is empty: bulb must be off and brightness must be none
  # ELSE (battery not empty): bulb can't be off and brightness can't be none
  - type: branching_constraint
    condition:
      type: attribute_check
      target: battery.level
      operator: equals
      value: empty
    effects:
      - type: set_attribute
        target: bulb.brightness
        value: none
      - type: set_attribute
        target: bulb.state
        value: off
    else_effects:
      # Exclude "off" from bulb.state when battery is not empty
      - type: set_attribute
        target: bulb.state
        value: "!off"
      # Exclude "none" from brightness when battery is not empty
      - type: set_attribute
        target: bulb.brightness
        value: "!none"

behaviors:
  # Turn on: All consumables trend down when in use
  turn_on:
    # Precondition: battery must not be empty
    preconditions:
      - type: attribute_check
        target: battery.level
        operator: not_equals
        value: empty
    effects:
      # Always set switch on
      - type: set_attribute
        target: switch.position
        value: "on"
      # Bulb turns on, but trends down (will turn off when battery empty)
      - type: set_attribute
        target: bulb.state
        value: "on"
      - type: set_trend
        target: bulb.state
        direction: down
      # Battery drains (trend down)
      - type: set_trend
        target: battery.level
        direction: down
      # Brightness will dim (trend down)
      - type: set_trend
        target: bulb.brightness
        direction: down
      # Flat if-elif-else for brightness based on battery.level
      # IF battery.level in {full, high} -> brightness = high
      - type: conditional
        condition:
          type: attribute_check
          target: battery.level
          operator: in
          value: [full, high]
        then:
          - type: set_attribute
            target: bulb.brightness
            value: high
      # ELIF battery.level == medium -> brightness = medium
      - type: conditional
        condition:
          type: attribute_check
          target: battery.level
          operator: equals
          value: medium
        then:
          - type: set_attribute
            target: bulb.brightness
            value: medium
      # ELIF battery.level == low -> brightness = low
      - type: conditional
        condition:
          type: attribute_check
          target: battery.level
          operator: equals
          value: low
        then:
          - type: set_attribute
            target: bulb.brightness
            value: low

  # Turn off: Stop all consumption trends
  turn_off:
    preconditions:
      - type: attribute_check
        target: switch.position
        operator: equals
        value: "on"
    effects:
      - type: set_attribute
        target: switch.position
        value: off
      # Bulb turns off, trend stops
      - type: set_attribute
        target: bulb.state
        value: off
      - type: set_trend
        target: bulb.state
        direction: none
      # Brightness goes to none, trend stops
      - type: set_attribute
        target: bulb.brightness
        value: none
      - type: set_trend
        target: bulb.brightness
        direction: none
      # Battery stops draining
      - type: set_trend
        target: battery.level
        direction: none
