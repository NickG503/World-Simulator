# Dice object for demonstrating DOUBLE MERGE
# ARCHITECTURE: Behaviors set direct effects only, Solver derives prize.level
#
# Has TWO independent unknown attributes: face and color
# Each causes branching, and reset merges all branches

type: dice_double_merge
parts:
  cube:
    attributes:
      face:
        space: dice_face
        default: "3"
        mutable: true
      color:
        space: dice_color
        default: "green"
        mutable: true
  prize:
    attributes:
      level:
        space: prize_level
        default: none
        mutable: true
      result:
        space: result_state
        default: none
        mutable: true

# =============================================================================
# SOLVER: Derives prize.level from cube.face and cube.color
# =============================================================================
solver:
  # Rule 1: Jackpot when face=6 and result is win_face
  - name: jackpot_from_face
    priority: 10
    description: "Jackpot when face is 6"
    condition:
      type: attribute_check
      target: cube.face
      operator: equals
      value: "6"
    implies:
      - type: set_attribute
        target: prize.level
        value: jackpot

  # Rule 2: Jackpot when color=red
  - name: jackpot_from_color
    priority: 15
    description: "Jackpot when color is red"
    condition:
      type: attribute_check
      target: cube.color
      operator: equals
      value: red
    implies:
      - type: set_attribute
        target: prize.level
        value: jackpot

  # Rule 3: Small prize when face in {3,5} (not 6)
  - name: small_from_face
    priority: 20
    description: "Small prize when face is 3 or 5"
    condition:
      type: attribute_check
      target: cube.face
      operator: in
      value: ["3", "5"]
    implies:
      - type: set_attribute
        target: prize.level
        value: small

  # Rule 4: Small prize when color in {green, blue} (not red)
  - name: small_from_color
    priority: 25
    description: "Small prize when color is green or blue"
    condition:
      type: attribute_check
      target: cube.color
      operator: in
      value: ["green", "blue"]
    implies:
      - type: set_attribute
        target: prize.level
        value: small

# =============================================================================
# BEHAVIORS: Direct action effects ONLY
# No derived state here - solver handles prize.level
# =============================================================================
behaviors:
  # Roll face - ONLY sets result, solver derives prize.level
  roll_face:
    preconditions:
      - type: attribute_check
        target: cube.face
        operator: in
        value: ["3", "5", "6"]
    effects:
      - type: set_attribute
        target: prize.result
        value: win

  # Roll color - ONLY sets result, solver derives prize.level
  roll_color:
    preconditions:
      - type: attribute_check
        target: cube.color
        operator: in
        value: ["green", "blue", "red"]
    effects:
      - type: set_attribute
        target: prize.result
        value: win

  # Reset face - Only resets face, solver derives prize.level
  reset_face:
    preconditions:
      - type: attribute_check
        target: cube.face
        operator: not_equals
        value: "3"
    effects:
      - type: set_attribute
        target: cube.face
        value: "3"
      - type: set_attribute
        target: prize.result
        value: none

  # Reset color - Resets color, solver derives prize.level
  reset_color:
    preconditions:
      - type: attribute_check
        target: cube.color
        operator: not_equals
        value: "green"
    effects:
      - type: set_attribute
        target: cube.color
        value: "green"
      - type: set_attribute
        target: prize.result
        value: none
