# Dice object definition
# ARCHITECTURE: Behaviors set direct effects only, Solver derives prize.level
#
# Scenario:
# - Precondition: face in {3, 5, 6} (face={1,2,4} FAILS, face={3,5,6} SUCCEEDS)
# - Action effect: Sets prize.result = win (direct effect)
# - Solver: Derives prize.level based on cube.color
#
# When face=unknown AND color=unknown:
# Creates branches through solver rules based on color.

type: dice
parts:
  cube:
    attributes:
      face:
        space: dice_face
        default: "3"
        mutable: true
      color:
        space: dice_color
        default: green
        mutable: true
  prize:
    attributes:
      level:
        space: prize_level
        default: none
        mutable: true
      result:
        space: result_state
        default: none
        mutable: true

# =============================================================================
# SOLVER: Derives prize.level from cube.color (when result is win)
# =============================================================================
solver:
  # Rule 1: Prize level depends on color (only when result is win)
  - name: prize_level_from_color
    priority: 10
    description: "Prize level derived from cube color when result is win"
    precondition:
      type: attribute_check
      target: prize.result
      operator: equals
      value: win
    cases:
      - condition:
          type: attribute_check
          target: cube.color
          operator: equals
          value: green
        implies:
          - type: set_attribute
            target: prize.level
            value: small
      - condition:
          type: attribute_check
          target: cube.color
          operator: equals
          value: red
        implies:
          - type: set_attribute
            target: prize.level
            value: medium
      - condition:
          type: attribute_check
          target: cube.color
          operator: in
          value: ["yellow", "black", "white"]
        implies:
          - type: set_attribute
            target: prize.level
            value: big
    otherwise:
      - type: set_attribute
        target: prize.level
        value: none

  # Rule 2: No prize level when result is not win
  - name: no_prize_when_no_win
    priority: 20
    description: "Prize level is none when result is not win"
    condition:
      type: attribute_check
      target: prize.result
      operator: not_equals
      value: win
    implies:
      - type: set_attribute
        target: prize.level
        value: none

# =============================================================================
# BEHAVIORS: Direct action effects ONLY
# No derived state here - solver handles prize.level
# =============================================================================
behaviors:
  # Check win - ONLY sets prize.result, solver handles prize.level
  check_win:
    # Precondition: face must be IN {3, 5, 6} to succeed
    preconditions:
      - type: attribute_check
        target: cube.face
        operator: in
        value: ["3", "5", "6"]
    effects:
      # ONLY the direct effect: mark as win
      # prize.level is derived by solver based on color
      - type: set_attribute
        target: prize.result
        value: win

  # Reset the dice
  reset:
    preconditions:
      - type: attribute_check
        target: prize.result
        operator: not_equals
        value: none
    effects:
      - type: set_attribute
        target: prize.result
        value: none
      # prize.level is derived by solver (will be set to none)
