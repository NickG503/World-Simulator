# Dice Cartesian - Demonstrates Cartesian product of precondition OR
# ARCHITECTURE: Behaviors set direct effects only, Solver derives prize.level
#
# Scenario:
# - Precondition: (face == 6) OR (color == red)
# - Action effect: Sets prize.result = win (direct effect)
# - Solver: Derives prize.level based on cube.size and cube.weight

type: dice_cartesian
parts:
  cube:
    attributes:
      face:
        space: dice_face
        default: "3"
        mutable: true
      color:
        space: dice_color
        default: green
        mutable: true
      size:
        space: dice_size
        default: medium
        mutable: true
      weight:
        space: dice_weight
        default: light
        mutable: true
  prize:
    attributes:
      level:
        space: prize_level
        default: none
        mutable: true
      result:
        space: result_state
        default: none
        mutable: true

# =============================================================================
# SOLVER: Derives prize.level from cube.size and cube.weight (when result is win)
# =============================================================================
solver:
  # Rule 1: Jackpot when size=large or weight=heavy
  - name: prize_jackpot
    priority: 10
    description: "Jackpot when size is large or weight is heavy"
    precondition:
      type: attribute_check
      target: prize.result
      operator: equals
      value: win
    condition:
      type: or
      conditions:
        - type: attribute_check
          target: cube.size
          operator: equals
          value: large
        - type: attribute_check
          target: cube.weight
          operator: equals
          value: heavy
    implies:
      - type: set_attribute
        target: prize.level
        value: jackpot

  # Rule 2: Small prize when size not large and weight not heavy
  - name: prize_small
    priority: 20
    description: "Small prize when size is not large and weight is not heavy"
    precondition:
      type: attribute_check
      target: prize.result
      operator: equals
      value: win
    condition:
      type: and
      conditions:
        - type: attribute_check
          target: cube.size
          operator: in
          value: ["small", "medium"]
        - type: attribute_check
          target: cube.weight
          operator: equals
          value: light
    implies:
      - type: set_attribute
        target: prize.level
        value: small

  # Rule 3: No prize level when result is not win
  - name: no_prize_when_no_win
    priority: 30
    description: "Prize level is none when result is not win"
    condition:
      type: attribute_check
      target: prize.result
      operator: not_equals
      value: win
    implies:
      - type: set_attribute
        target: prize.level
        value: none

# =============================================================================
# BEHAVIORS: Direct action effects ONLY
# No derived state here - solver handles prize.level
# =============================================================================
behaviors:
  # Check win - ONLY sets prize.result, solver handles prize.level
  check_cartesian:
    # Precondition: face==6 OR color==red
    preconditions:
      - type: or
        conditions:
          - type: attribute_check
            target: cube.face
            operator: equals
            value: "6"
          - type: attribute_check
            target: cube.color
            operator: equals
            value: red
    effects:
      # ONLY the direct effect: mark as win
      - type: set_attribute
        target: prize.result
        value: win

  # Check with else - ONLY sets prize.result
  check_with_else:
    preconditions:
      - type: attribute_check
        target: cube.face
        operator: gte
        value: "4"
    effects:
      - type: set_attribute
        target: prize.result
        value: win

  # Reset the dice
  reset:
    effects:
      - type: set_attribute
        target: prize.result
        value: none
