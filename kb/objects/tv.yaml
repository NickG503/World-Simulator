# TV object definition
# Simplified for tree-based simulation - all defaults are known values
#
# ARCHITECTURE: Behaviors set direct effects only, Solver derives brightness

type: tv
parts:
  button:
    attributes:
      state:
        space: binary_state
        default: 'on'
        mutable: true
  screen:
    attributes:
      power:
        space: binary_state
        default: 'off'
        mutable: true
      brightness:
        space: brightness_level
        default: none
  audio:
    attributes:
      volume:
        space: volume_level
        default: medium
        mutable: true
      channel:
        space: channel_number
        default: low
        mutable: true
  network:
    attributes:
      wifi_connected:
        space: binary_state
        default: 'on'
        mutable: true
  power_source:
    attributes:
      connection:
        space: binary_state
        default: 'on'
        mutable: true
      voltage:
        space: power_level
        default: high
        mutable: true
  cooling:
    attributes:
      temperature:
        space: temperature_level
        default: cold
        mutable: true

# =============================================================================
# SOLVER: Derives screen.brightness from screen.power
# =============================================================================
solver:
  # Rule 1: Screen brightness depends on power
  - name: screen_brightness_from_power
    priority: 10
    description: "Screen brightness is medium when power is on"
    condition:
      type: attribute_check
      target: screen.power
      operator: equals
      value: on
    implies:
      - type: set_attribute
        target: screen.brightness
        value: medium
    otherwise:
      - type: set_attribute
        target: screen.brightness
        value: none

  # Rule 2: Cooling temperature trend depends on power
  - name: cooling_trend_from_power
    priority: 20
    description: "Temperature rises when screen is on, falls when off"
    condition:
      type: attribute_check
      target: screen.power
      operator: equals
      value: on
    implies:
      - type: set_trend
        target: cooling.temperature
        direction: up
    otherwise:
      - type: set_trend
        target: cooling.temperature
        direction: none

# =============================================================================
# CONSTRAINTS: Dependency and branching constraints
# =============================================================================
constraints:
  # Dependency: Screen needs power source
  - type: dependency
    condition:
      type: attribute_check
      target: screen.power
      operator: equals
      value: on
    requires:
      type: attribute_check
      target: power_source.connection
      operator: not_equals
      value: off

  # Dependency: If hot, screen must be off
  - type: dependency
    condition:
      type: attribute_check
      target: cooling.temperature
      operator: equals
      value: hot
    requires:
      type: attribute_check
      target: screen.power
      operator: equals
      value: off

  # Branching: When temperature reaches hot, force shutdown
  - type: branching_constraint
    name: overheat_protection
    condition:
      type: attribute_check
      target: cooling.temperature
      operator: equals
      value: hot
    effects:
      # When temperature IS hot: emergency shutdown
      - type: set_attribute
        target: screen.power
        value: "off"
      - type: set_attribute
        target: screen.brightness
        value: none
      - type: set_trend
        target: cooling.temperature
        direction: none
    else_effects:
      # When temperature is NOT hot: normal operation
      - type: set_attribute
        target: cooling.temperature
        value: "!hot"

# =============================================================================
# BEHAVIORS: Direct action effects ONLY
# No derived state here - solver handles that
# =============================================================================
behaviors:
  turn_on:
    preconditions:
      - type: attribute_check
        target: screen.power
        operator: equals
        value: off
    effects:
      - type: set_attribute
        target: button.state
        value: "on"
      - type: set_attribute
        target: screen.power
        value: "on"
      # screen.brightness is derived by solver
      # cooling.temperature trend is derived by solver

  turn_off:
    preconditions:
      - type: attribute_check
        target: screen.power
        operator: equals
        value: on
    effects:
      - type: set_attribute
        target: button.state
        value: off
      - type: set_attribute
        target: screen.power
        value: off
      # screen.brightness is derived by solver
      # cooling.temperature trend is derived by solver
